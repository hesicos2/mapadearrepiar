<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de Arrepiar — Aparições do Pará e do Brasil</title>
<meta name="description" content="Mapa interativo com relatos de lobisomem, matinta, boto, OVNI, fantasma e outras aparições do canal Belém de Arrepiar.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%91%BB</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<style>
  :root{
    --bg:#EAF2E4;
    --panel:#F6FAF3;
    --panel-2:#E4EFDB;
    --border:#C6DBBC;
    --fg:#2C3B28;
    --fg-muted:#637759;
    --accent:#D98C2D;
    --accent-2:#F0B65A;
    --danger:#C0553A;
    --radius:14px;
    --shadow:0 10px 26px rgba(43,58,39,.16);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--fg);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    overflow:hidden;
  }
  h1,h2,h3,.display{ font-family:'Fraunces',serif; font-optical-sizing:auto; }
  #map{
    position:fixed; inset:0;
    padding-top:env(safe-area-inset-top,0px);
  }
  .leaflet-container{ background:var(--bg); }
  .leaflet-control-attribution{ background:rgba(246,250,243,.85) !important; color:var(--fg-muted) !important; font-size:10.5px; }
  .leaflet-control-attribution a{ color:var(--fg-muted) !important; }
  .leaflet-control-zoom a{
    background:var(--panel) !important; color:var(--fg) !important; border-color:var(--border) !important;
  }
  .leaflet-control-zoom a:hover{ background:var(--panel-2) !important; }

  /* ---- Topbar ---- */
  #topbar{
    position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); left:16px; right:16px;
    z-index:1000; display:flex; gap:10px; align-items:center; justify-content:flex-end; pointer-events:none;
  }
  #searchWrap{ pointer-events:auto; display:flex; justify-content:flex-end; gap:8px; }
  #search{
    width:min(260px,52vw); background:var(--panel); border:1px solid var(--border); color:var(--fg);
    border-radius:999px; padding:10px 16px; font-size:.85rem; box-shadow:var(--shadow); outline:none;
    font-family:'Inter',sans-serif;
  }
  #search::placeholder{ color:var(--fg-muted); }
  #search:focus{ border-color:var(--accent); }

  /* ---- Panel (marca + categorias, recolhível) ---- */
  #panel{
    position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); left:16px;
    width:300px; z-index:900; max-width:calc(100vw - 32px);
    background:linear-gradient(180deg, var(--panel), var(--panel-2) 140%);
    border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden;
    max-height:calc(100vh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column;
  }
  #panelHeader{
    all:unset; box-sizing:border-box; cursor:pointer; position:relative; overflow:hidden;
    padding:11px 40px 11px 14px; display:flex; align-items:center; gap:10px; flex:none;
  }
  #panelHeader::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(var(--accent), var(--accent-2));
  }
  #panelHeader .glyph{ font-size:1.5rem; line-height:1; filter:drop-shadow(0 0 8px rgba(232,163,61,.55)); flex:none; }
  #panelHeader .titleBlock{ min-width:0; }
  #panelHeader h1{ font-size:1.05rem; margin:0; font-weight:600; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #panelHeader h1 .ver{ font-size:.66rem; font-weight:500; color:var(--fg-muted); font-family:'Inter',sans-serif; vertical-align:middle; }
  #panelHeader p{ margin:2px 0 0; font-size:.71rem; color:var(--fg-muted); font-style:italic; font-family:'Fraunces',serif;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #pinBtn{
    position:absolute; top:10px; right:34px; background:none; border:none; cursor:pointer;
    padding:4px; line-height:1; color:#C0553A;
  }
  #pinBtn svg{ width:15px; height:15px; display:block; }
  #pinBtn.pinned{ color:#4E9C6D; }
  #chev{
    position:absolute; top:12px; right:12px; font-size:.8rem; color:var(--fg-muted);
    transition:transform .2s ease; line-height:1; pointer-events:none;
  }
  #panel.collapsed #chev{ transform:rotate(-90deg); }
  #panelBody{
    overflow:hidden; max-height:2000px; opacity:1;
    transition:max-height .28s ease, opacity .2s ease;
    display:flex; flex-direction:column; min-height:0;
  }
  #panel.collapsed #panelBody{ max-height:0; opacity:0; }
  #panel .panelHead{ padding:12px 16px 10px; border-top:1px solid var(--border); position:relative; flex:none; }
  #panel .panelHead::after{
    content:''; position:absolute; left:16px; bottom:-1px; width:34px; height:2px; background:var(--accent);
  }
  #panel .panelHead h2{ font-size:1rem; margin:0 0 3px; font-weight:600; }
  #panel .panelHead p{ margin:0; font-size:.72rem; color:var(--fg-muted); }
  #catList{ flex:1; overflow-y:auto; padding:6px 8px; min-height:0; }
  .catRow{
    display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:9px; cursor:pointer;
    font-size:.83rem; user-select:none;
  }
  .catRow:hover{ background:var(--panel-2); }
  .catRow input{ accent-color:var(--accent); width:15px; height:15px; flex:none; }
  .catRow .dot{ width:20px; height:20px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; }
  .catRow .dot svg{ width:14px; height:14px; }
  .catRow .name{ flex:1; }
  .catRow .count{ color:var(--fg-muted); font-size:.74rem; font-variant-numeric:tabular-nums; }
  #panelFoot{ border-top:1px solid var(--border); padding:10px 14px 12px; font-size:.72rem; color:var(--fg-muted); }
  .footRow{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; }
  .linkBtn{ background:none; border:none; color:var(--accent); font-size:.74rem; cursor:pointer; padding:0; font-family:'Inter',sans-serif; }
  .linkBtn:hover{ text-decoration:underline; }
  #legend{ display:flex; flex-wrap:wrap; gap:6px 10px; margin-top:8px; }
  #legend span{ display:flex; align-items:center; gap:5px; font-size:.68rem; color:var(--fg-muted); }
  #legend i{ width:8px; height:8px; border-radius:50%; display:inline-block; }

  /* ---- botão flutuante de estatísticas ---- */
  #statsFloatBtn{
    pointer-events:auto; flex:none; width:46px; height:46px; border-radius:50%; cursor:pointer;
    background:linear-gradient(155deg, var(--accent-2), var(--accent)); color:#1A1208;
    border:2px solid rgba(255,255,255,.65);
    box-shadow:var(--shadow), 0 0 0 4px rgba(217,140,45,.18);
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  #statsFloatBtn svg{ width:22px; height:22px; }
  #statsFloatBtn:hover{ transform:translateY(-2px); box-shadow:var(--shadow), 0 0 0 6px rgba(217,140,45,.24); }
  #statsFloatBtn:disabled{ opacity:.45; cursor:default; transform:none; box-shadow:var(--shadow); }

  /* ---- modal de estatísticas ---- */
  .statsOverlay{
    position:fixed; inset:0; z-index:3000; background:rgba(26,36,22,.42);
    display:flex; align-items:center; justify-content:center; padding:20px;
    backdrop-filter:blur(1.5px);
  }
  .statsOverlay[hidden]{ display:none; }
  .statsModal{
    position:relative; width:min(480px,100%); max-height:min(84vh,680px);
    background:linear-gradient(165deg, var(--panel), var(--panel-2) 140%);
    border:1px solid var(--border); border-radius:18px; box-shadow:0 20px 48px rgba(43,58,39,.28);
    padding:22px 22px 20px; overflow-y:auto;
  }
  .statsModal::before{
    content:''; position:absolute; left:0; top:0; right:0; height:5px; border-radius:18px 18px 0 0;
    background:linear-gradient(90deg, var(--accent), var(--accent-2), #8FB07A);
  }
  .statsModal h2{
    margin:4px 0 16px; font-size:1.2rem; font-weight:700; padding-right:28px; color:var(--fg);
    font-family:'Fraunces',serif; display:flex; align-items:center; gap:9px;
  }
  .catDot{ width:16px; height:16px; border-radius:50%; flex:none; box-shadow:0 0 0 2px rgba(255,255,255,.5); }
  .catLink{
    background:none; border:none; font:inherit; color:inherit; text-align:left; padding:0; cursor:pointer;
  }
  .catLink:hover{ color:var(--accent); text-decoration:underline; }
  .statsClose{
    position:absolute; top:16px; right:16px; background:var(--panel-2); border:1px solid var(--border);
    color:var(--fg-muted); width:26px; height:26px; border-radius:50%;
    font-size:.85rem; cursor:pointer; line-height:1; padding:0; display:flex; align-items:center; justify-content:center;
  }
  .statsClose:hover{ color:var(--fg); border-color:var(--accent); }
  .statsSection{ margin-bottom:20px; }
  .statsSection:last-child{ margin-bottom:0; }
  .statsSection h3{
    font-size:.76rem; text-transform:uppercase; letter-spacing:.06em; color:var(--accent);
    margin:0 0 10px; font-weight:700;
  }
  .statsSecHead{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .statsSecHead h3{ margin:0; }
  .chartToggle{ display:flex; background:var(--panel-2); border:1px solid var(--border); border-radius:999px; padding:2px; gap:2px; }
  .toggleBtn{
    border:none; background:none; color:var(--fg-muted); font-size:.7rem; font-weight:700; padding:5px 12px;
    border-radius:999px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .toggleBtn.active{ background:var(--accent); color:#1A1208; }

  .statsList{ list-style:none; margin:0; padding:0; }
  .statsList li{ display:flex; align-items:center; gap:9px; padding:6px 0; font-size:.83rem; }
  .statsList .rank{ width:24px; flex:none; text-align:center; font-size:.9rem; color:var(--fg-muted); font-variant-numeric:tabular-nums; }
  .statsList .name{
    width:118px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500;
    background:none; border:none; font-family:'Inter',sans-serif; font-size:inherit; color:var(--fg);
    text-align:left; padding:0; cursor:pointer;
  }
  .statsList button.name:hover{ color:var(--accent); text-decoration:underline; }
  .statsList .track{ flex:1; background:var(--panel-2); border-radius:6px; height:11px; overflow:hidden; border:1px solid var(--border); }
  .statsList .fill{ display:block; height:100%; border-radius:6px 0 0 6px; background:linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .statsList .n{ width:32px; flex:none; text-align:right; color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums; font-size:.78rem; }
  .moreBtn{
    display:block; margin:8px auto 0; background:none; border:1px dashed var(--border); color:var(--accent);
    font-size:.72rem; font-weight:600; padding:6px 16px; border-radius:999px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .moreBtn:hover{ background:var(--panel-2); border-style:solid; border-color:var(--accent); }

  .statsPage[hidden]{ display:none; }
  .backBtn{
    background:none; border:none; color:var(--accent); font-weight:600; font-size:.78rem; cursor:pointer;
    padding:0 0 10px; font-family:'Inter',sans-serif;
  }
  .backBtn:hover{ text-decoration:underline; }
  .localTotalText{ margin:-6px 0 16px; font-size:.78rem; color:var(--fg-muted); }

  .chartView[hidden]{ display:none; }
  .donutWrap{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  .donutOuter{ position:relative; width:172px; height:172px; flex:none; }
  .donut{ width:100%; height:100%; border-radius:50%; box-shadow:inset 0 0 0 1px var(--border); }
  .donutCenter{
    position:absolute; inset:30px; border-radius:50%; background:var(--panel);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:inset 0 0 0 1px var(--border);
  }
  .donutCenter span{ font-family:'Fraunces',serif; font-size:1.5rem; font-weight:700; color:var(--fg); line-height:1; }
  .donutCenter small{ font-size:.6rem; color:var(--fg-muted); text-transform:uppercase; letter-spacing:.05em; margin-top:3px; }
  .donutLegend{
    list-style:none; margin:0; padding:0; width:100%;
    display:grid; grid-template-columns:1fr 1fr; gap:5px 12px;
  }
  .donutLegend li{ display:flex; align-items:center; gap:6px; font-size:.72rem; color:var(--fg); }
  .donutLegend li .sw{ width:9px; height:9px; border-radius:50%; flex:none; }
  .donutLegend li .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .donutLegend li .pc{ color:var(--fg-muted); font-variant-numeric:tabular-nums; font-size:.68rem; flex:none; }

  .statsBars{ display:flex; flex-direction:column; gap:7px; }
  .statsBarRow{ display:flex; align-items:center; gap:8px; font-size:.78rem; }
  .statsBarRow .lbl{ width:108px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .statsBarRow .track{ flex:1; background:var(--panel-2); border-radius:5px; height:10px; overflow:hidden; border:1px solid var(--border); }
  .statsBarRow .fill{ display:block; height:100%; border-radius:5px 0 0 5px; }
  .statsBarRow .n{ width:30px; flex:none; text-align:right; color:var(--fg-muted); font-size:.72rem; font-variant-numeric:tabular-nums; }

  /* ---- Popup ---- */
  .leaflet-popup-content-wrapper{
    background:var(--panel); color:var(--fg); border-radius:12px; border:1px solid var(--border);
  }
  .leaflet-popup-tip{ background:var(--panel); }
  .leaflet-popup-content{ margin:0; width:280px !important; }
  .leaflet-popup-close-button{ color:var(--fg-muted) !important; }
  .pop{ padding:12px 14px 14px; }
  .pop .head{ display:flex; align-items:center; gap:9px; margin-bottom:8px; }
  .pop .head .dot{ width:30px; height:30px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; }
  .pop .head .dot svg{ width:20px; height:20px; }
  .pop .head .cat{ font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--fg-muted); }
  .pop .head .rel{ font-family:'Fraunces',serif; font-size:1.02rem; font-weight:600; line-height:1.15; }
  .pop .loc{ font-size:.78rem; color:var(--accent); font-weight:600; margin-bottom:6px; }
  .pop .obs{ font-size:.68rem; color:var(--fg-muted); font-style:italic; margin:-4px 0 6px; }
  .pop .trecho{ font-size:.78rem; line-height:1.45; color:var(--fg); opacity:.85; margin-bottom:10px;
    max-height:120px; overflow-y:auto; padding-right:2px; }
  .pop a.watch{
    display:flex; align-items:center; justify-content:center; gap:7px; background:var(--accent); color:#1A1208;
    text-decoration:none; font-weight:600; font-size:.82rem; padding:9px 10px; border-radius:9px;
  }
  .pop a.watch:hover{ background:var(--accent-2); }
  .pop .playerWrap{
    position:relative; width:100%; aspect-ratio:16/9; border-radius:9px; overflow:hidden; margin-bottom:8px;
    background:#000;
  }
  .pop .playerWrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .pop .facade{
    position:absolute; inset:0; width:100%; height:100%; border:0; cursor:pointer; padding:0;
    background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center;
  }
  .pop .facade::after{ content:''; position:absolute; inset:0; background:rgba(0,0,0,.18); }
  .pop .facade .playBtn{
    position:relative; z-index:1; width:46px; height:46px; border-radius:50%; background:rgba(20,16,10,.78);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:1.1rem;
    box-shadow:0 0 0 2px rgba(255,255,255,.5);
  }
  .pop .toggleFull{
    display:block; text-align:center; font-size:.68rem; color:var(--fg-muted); text-decoration:none; margin:-4px 0 8px;
  }
  .pop .toggleFull:hover{ color:var(--accent-2); }

  /* cluster icons */
  .arrepiar-cluster{
    background:radial-gradient(circle at 32% 26%, var(--accent-2), var(--accent) 72%);
    color:#1A1208; border:2px solid rgba(10,8,3,.5); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'Inter',sans-serif;
  }
  .marker-icon-wrap{
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.55)) drop-shadow(0 0 7px color-mix(in srgb, var(--glow) 65%, transparent));
    transition: transform .15s ease;
  }
  .leaflet-marker-icon:hover .marker-icon-wrap{ transform:scale(1.18); }


  #loading{
    position:fixed; inset:0; z-index:2000;
    background:radial-gradient(circle at 50% 42%, #FFFFFF, var(--bg) 72%);
    color:var(--fg-muted);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    font-size:.85rem; transition:opacity .5s ease;
  }
  #loading .glyph{ font-size:2.6rem; animation:riseGlow 2.2s ease-in-out infinite; }
  #loading .lTitle{ font-family:'Fraunces',serif; color:var(--fg); font-size:1.3rem; margin-top:6px; }
  @keyframes riseGlow{
    0%,100%{ transform:translateY(0); filter:drop-shadow(0 0 10px rgba(232,163,61,.35)); }
    50%{ transform:translateY(-6px); filter:drop-shadow(0 0 20px rgba(232,163,61,.65)); }
  }
  @media (prefers-reduced-motion: reduce){ #loading .glyph{ animation:none; } }

  @media (max-width: 760px){
    /* busca sempre em cima, numa faixa de altura fixa; o painel cresce por baixo dela, nunca por cima */
    #topbar{
      left:10px; right:10px; justify-content:stretch;
      top:calc(10px + env(safe-area-inset-top,0px));
    }
    #searchWrap{ flex:1; }
    #search{ width:100%; padding:9px 14px; font-size:.82rem; }

    #panel{
      left:10px; right:10px; width:auto;
      top:calc(58px + env(safe-area-inset-top,0px));
      max-height:min(56vh, calc(100vh - 68px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));
    }
    #panelHeader{ padding:8px 36px 8px 12px; }
    #panelHeader h1{ font-size:.9rem; }
    #panelHeader p{ display:none; }
    #pinBtn{ right:30px; top:6px; }
    #chev{ top:9px; }

    /* linhas de categoria mais compactas, pra caber mais sem rolar tanto */
    #panel .panelHead{ padding:8px 14px 7px; }
    #catList{ padding:3px 6px; }
    .catRow{ padding:4px 7px; gap:7px; font-size:.79rem; }
    .catRow .dot{ width:17px; height:17px; }
    .catRow .dot svg{ width:12px; height:12px; }
    #panelFoot{ padding:7px 12px 9px; }

    #statsFloatBtn{ width:40px; height:40px; }
    #statsFloatBtn svg{ width:19px; height:19px; }

    .statsModal{ padding:18px 16px 16px; }
    .statsModal h2{ font-size:1.05rem; }
    .donutOuter{ width:148px; height:148px; }
    .donutCenter{ inset:26px; }
    .donutCenter span{ font-size:1.3rem; }
    .statsList .name{ width:96px; font-size:.78rem; }
    .statsBarRow .lbl{ width:80px; font-size:.73rem; }
  }
</style>
</head>
<body>

<div id="loading"><div class="glyph">🌙</div><div class="lTitle">Mapa de Arrepiar</div><div>Carregando os relatos…</div></div>

<div id="map"></div>

<div id="topbar">
  <button id="statsFloatBtn" type="button" aria-label="Ver estatísticas do mapa" title="Estatísticas" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20V10M12 20V4M20 20v-7"/>
    </svg>
  </button>
  <div id="searchWrap">
    <input id="search" type="text" placeholder="Busca lugar, criatura ou palavra">
  </div>
</div>

<div id="panel">
  <button id="panelHeader" aria-expanded="true" aria-controls="panelBody">
    <span class="glyph">🌙</span>
    <div class="titleBlock">
      <h1>Mapa de Arrepiar <span class="ver">v9.9</span></h1>
      <p>Canal Belém de Arrepiar</p>
    </div>
  </button>
  <button id="pinBtn" aria-label="Fixar painel aberto" aria-pressed="false" title="Fixar painel aberto (não fecha ao clicar no mapa)">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a6 6 0 00-6 6c0 4.2 6 13 6 13s6-8.8 6-13a6 6 0 00-6-6zm0 8.3A2.3 2.3 0 1112 5.7a2.3 2.3 0 010 4.6z"/></svg>
  </button>
  <span id="chev" aria-hidden="true">⌄</span>
  <div id="panelBody">
    <div class="panelHead">
      <h2>Categorias</h2>
      <p id="visibleCount">carregando…</p>
    </div>
    <div id="catList"></div>

function catIconHtml(cat){
  const m = CAT_META[cat] || CAT_META['Outros'];
  return `<div class="marker-icon-wrap" style="--glow:${m.cor}">${m.svg}</div>`;
}
const iconCache = {};
function getIcon(cat){
  if(!iconCache[cat]){
    iconCache[cat] = L.divIcon({
      html: catIconHtml(cat),
      className: '',
      iconSize: [34,34],
      iconAnchor: [17,17],
      popupAnchor: [0,-15],
    });
  }
  return iconCache[cat];
}

function clusterIcon(cluster){
  const n = cluster.getChildCount();
  let size = 36;
  if(n>=50) size=58; else if(n>=10) size=46;
  const tally = {};
  cluster.getAllChildMarkers().forEach(m=>{
    const g = (CAT_META[m.options.cat]||{}).grupo || 'outros';
    tally[g] = (tally[g]||0) + 1;
  });
  const dominant = Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  const ring = dominant ? (GROUPS.find(g=>g[0]===dominant[0])||[])[2] : 'var(--accent)';
  return L.divIcon({
    html: `<div class="arrepiar-cluster" style="width:${size}px;height:${size}px;font-size:${size>50?'1rem':'.82rem'};box-shadow:0 0 0 2.5px ${ring}, 0 6px 16px rgba(0,0,0,.5)">${n}</div>`,
    className:'', iconSize:[size,size]
  });
}

const clusterGroup = L.markerClusterGroup({
  iconCreateFunction: clusterIcon,
  showCoverageOnHover:false,
  spiderfyOnMaxZoom:true,
  maxClusterRadius:50,
});
map.addLayer(clusterGroup);
map.on('popupopen', (e)=>{
  L.DomEvent.disableClickPropagation(e.popup._contentNode);
  L.DomEvent.disableScrollPropagation(e.popup._contentNode);
});

function esc(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function trimTrecho(t){
  if(!t) return '';
  t = t.trim();
  return t.length>260 ? t.slice(0,260).trim()+'…' : t;
}
function ytId(url){
  const m = /(?:v=|youtu\.be\/|embed\/)([\w-]{11})/.exec(url||'');
  return m ? m[1] : null;
}
function ytStart(r){
  const m = /[?&]t=(\d+)s?/.exec(r.link_minuto||'');
  if(m) return parseInt(m[1],10);
  const mm = /^(\d+):(\d\d):(\d\d)$/.exec(r.minuto||'');
  if(mm) return (+mm[1])*3600 + (+mm[2])*60 + (+mm[3]);
  return 0;
}
window.loadYTPlayer = function(ev, btn, id, start){
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  const wrap = btn.parentElement;
  const iframe = document.createElement('iframe');
  iframe.src = `https://www.youtube-nocookie.com/embed/${id}?start=${start}&autoplay=1&rel=0`;
  iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
  iframe.allowFullscreen = true;
  wrap.innerHTML = '';
  wrap.appendChild(iframe);
};
function popupHtml(r){
  const m = CAT_META[r.categoria] || CAT_META['Outros'];
  const obs = r.observacao ? `<div class="obs">${esc(r.observacao)}</div>` : '';
  const min = (r.minuto && r.minuto !== '—') ? ` a partir de ${esc(r.minuto)}` : '';
  const id = ytId(r.video_url);
  const start = ytStart(r);
  const player = id ? `<div class="playerWrap">
      <button class="facade" type="button" style="background-image:url('https://i.ytimg.com/vi/${id}/hqdefault.jpg')"
        onclick="loadYTPlayer(event, this, '${id}', ${start})" aria-label="Assistir aqui">
        <span class="playBtn">▶</span>
      </button>
    </div>` : '';
  return `<div class="pop">
    <div class="head">
      <div class="dot" style="background:${m.cor}">${m.svg.replace('width="64" height="64"','width="20" height="20"')}</div>
      <div><div class="cat">${esc(m.rotulo)}</div><div class="rel">${esc(r.nome_relatado || r.categoria)}</div></div>
    </div>
    <div class="loc">📍 ${esc(r.local)}</div>
    ${obs}
    <div class="trecho">${esc(trimTrecho(r.trecho))}</div>
    ${player}
    <a class="watch" href="${esc(r.link_minuto || r.video_url)}" target="_blank" rel="noopener">▶ Abrir no YouTube${min}</a>
  </div>`;
}

const RANK_MEDALS = ['🥇','🥈','🥉'];
const LOCAIS_PREVIEW = 10;

// paleta própria das estatísticas: cores vivas e bem diferentes entre si,
// independente das cores dos ícones do mapa (que se repetem por grupo).
const STATS_COLORS = {
  "Fantasma":"#A54D27","Lobisomem":"#23C784","OVNI":"#AD2DBE","Matinta":"#94AD1F",
  "Curupira":"#2D7ABE","Iara":"#C7234B","Luz misteriosa":"#27A52D","Morcegão":"#5B23C7",
  "Criatura não identificada":"#BE892D","Boto":"#1FADA3","Alien":"#BE2D9E","Encantado":"#74C723",
  "Outros":"#2740A5","Mapinguari":"#C73323","Bruxa":"#2DBE65","Boiúna":"#7F1FAD",
  "Vampiro":"#BEB92D","Reptiliano":"#239DC7","Ataíde":"#A5275F","Chupa-cabra":"#3DC723",
  "Caipora":"#402DBE","Saci":"#AD5C1F","Boitatá":"#2DBE95","Fulozinha":"#C723C6","Vira-porco":"#7FA527"
};

// renderizador genérico de "ranking de lugares" (usado na lista geral e na lista por categoria),
// cada um com seu próprio estado de expandir/recolher e com os nomes virando links clicáveis
function createRankingRenderer(listEl, moreBtnEl, onClickName){
  let data = [];
  let expanded = false;
  function render(){
    const rows = expanded ? data : data.slice(0, LOCAIS_PREVIEW);
    const maxV = data.length ? data[0][1] : 1;
    listEl.innerHTML = rows.length
      ? rows.map(([nome,n],i)=>{
          const pct = Math.round((n/maxV)*100);
          const rank = RANK_MEDALS[i] || `${i+1}.`;
          return `<li><span class="rank">${rank}</span>
            <button type="button" class="name" data-name="${esc(nome)}" title="Ver estatísticas de ${esc(nome)}">${esc(nome)}</button>
            <span class="track"><span class="fill" style="width:${pct}%"></span></span>
            <span class="n">${n}</span></li>`;
        }).join('')
      : '<li><span class="name">Sem dados de local.</span></li>';
    if(!expanded && data.length > LOCAIS_PREVIEW){
      moreBtnEl.hidden = false;
      moreBtnEl.textContent = `+ Ver mais lugares (${data.length - LOCAIS_PREVIEW})`;
    } else {
      moreBtnEl.hidden = true;
    }
  }
  listEl.addEventListener('click', (ev)=>{
    const btn = ev.target.closest('button[data-name]');
    if(btn) onClickName(btn.dataset.name);
  });
  moreBtnEl.addEventListener('click', ()=>{ expanded = true; render(); });
  return { setData(newData){ data = newData; expanded = false; render(); } };
}

// desenha rosca + legenda + barras a partir de {categoria: contagem}, em qualquer um dos containers do modal;
// os nomes das categorias (legenda e barras) viram links que abrem o ranking de lugares daquela categoria
function renderCategoryChart(categCounts, els){
  const ordered = Object.keys(categCounts).sort((a,b)=> categCounts[b]-categCounts[a]);
  const total = ordered.reduce((s,c)=> s + categCounts[c], 0) || 1;
  const maxCat = Math.max(1, ...ordered.map(c=> categCounts[c]));

  let acc = 0;
  const stops = ordered.map(cat=>{
    const color = STATS_COLORS[cat] || '#8A8A8A';
    const n = categCounts[cat];
    const start = (acc/total)*360;
    acc += n;
    const end = (acc/total)*360;
    return `${color} ${start}deg ${end}deg`;
  });
  els.donutEl.style.background = ordered.length ? `conic-gradient(${stops.join(',')})` : 'var(--panel-2)';
  els.totalEl.textContent = total.toLocaleString('pt-BR');

  els.legendEl.innerHTML = ordered.map(cat=>{
    const color = STATS_COLORS[cat] || '#8A8A8A';
    const rotulo = (CAT_META[cat]||{}).rotulo || cat;
    const n = categCounts[cat];
    const pct = ((n/total)*100).toFixed(1).replace('.', ',');
    return `<li><span class="sw" style="background:${color}"></span>
      <button type="button" class="catLink nm" data-cat="${esc(cat)}" title="Ver locais com mais ${esc(rotulo)}">${esc(rotulo)}</button>
      <span class="pc">${pct}%</span></li>`;
  }).join('');

  els.barsEl.innerHTML = ordered.map(cat=>{
    const color = STATS_COLORS[cat] || '#8A8A8A';
    const rotulo = (CAT_META[cat]||{}).rotulo || cat;
    const n = categCounts[cat];
    const pct = Math.round((n/maxCat)*100);
    return `<div class="statsBarRow">
      <button type="button" class="catLink lbl" data-cat="${esc(cat)}" title="Ver locais com mais ${esc(rotulo)}">${esc(rotulo)}</button>
      <span class="track"><span class="fill" style="width:${pct}%;background:${color}"></span></span>
      <span class="n">${n}</span>
    </div>`;
  }).join('');
}

const globalRankingRenderer = createRankingRenderer(
  document.getElementById('statsLocais'), document.getElementById('statsMoreBtn'),
  (name)=> openLocalStats(name));
const catRankingRenderer = createRankingRenderer(
  document.getElementById('catLocais'), document.getElementById('catMoreBtn'),
  (name)=> openLocalStats(name));

function buildStats(){
  if(!DATA) return;

  // ---- ranking de locais com mais relatos ----
  const porLocal = {};
  DATA.relatos.forEach(r=>{
    const loc = (r.local||'').trim();
    if(!loc) return;
    porLocal[loc] = (porLocal[loc]||0) + 1;
  });
  globalRankingRenderer.setData(Object.entries(porLocal).sort((a,b)=>b[1]-a[1]));

  // ---- distribuição geral por categoria ----
  const counts = {};
  CAT_ORDER.forEach(cat=>{
    const n = (markersByCat[cat]||[]).length;
    if(n>0) counts[cat] = n;
  });
  renderCategoryChart(counts, {
    donutEl: document.getElementById('statsDonut'),
    totalEl: document.getElementById('donutTotal'),
    legendEl: document.getElementById('statsDonutLegend'),
    barsEl: document.getElementById('statsCats'),
  });
}

function openLocalStats(localName){
  const relatosLocal = DATA.relatos.filter(r => (r.local||'').trim() === localName);
  const counts = {};
  relatosLocal.forEach(r=>{ counts[r.categoria] = (counts[r.categoria]||0) + 1; });

  document.getElementById('localTitle').textContent = `📍 ${localName}`;
  const n = relatosLocal.length;
  document.getElementById('localTotal').textContent =
    `${n.toLocaleString('pt-BR')} relato${n===1?'':'s'} registrado${n===1?'':'s'} neste lugar`;

  renderCategoryChart(counts, {
    donutEl: document.getElementById('localDonut'),
    totalEl: document.getElementById('localDonutTotal'),
    legendEl: document.getElementById('localDonutLegend'),
    barsEl: document.getElementById('localCats'),
  });

  setLocalChartView('donut');
  goToStatsPage('statsLocalView');
}

function openCategoryStats(catKey){
  const relatosCat = DATA.relatos.filter(r => r.categoria === catKey);
  const porLocal = {};
  relatosCat.forEach(r=>{
    const loc = (r.local||'').trim();
    if(!loc) return;
    porLocal[loc] = (porLocal[loc]||0) + 1;
  });
  const ranking = Object.entries(porLocal).sort((a,b)=>b[1]-a[1]);
  const rotulo = (CAT_META[catKey]||{}).rotulo || catKey;
  const color = STATS_COLORS[catKey] || '#8A8A8A';

  document.getElementById('catViewDot').style.background = color;
  document.getElementById('catViewName').textContent = rotulo;
  const n = relatosCat.length;
  document.getElementById('catViewTotal').textContent =
    `${n.toLocaleString('pt-BR')} relato${n===1?'':'s'} de ${rotulo} no total, em ${ranking.length} lugar${ranking.length===1?'':'es'}`;

  catRankingRenderer.setData(ranking);
  goToStatsPage('statsCategoryView');
}

function activeCats(){
  return Array.from(document.querySelectorAll('#catList input:checked')).map(el=>el.dataset.cat);
}

function refresh(){
  const cats = new Set(activeCats());
  const q = document.getElementById('search').value.trim().toLowerCase();
  clusterGroup.clearLayers();
  let shown = 0;
  DATA.relatos.forEach(r=>{
    if(!cats.has(r.categoria)) return;
    if(q){
      const hay = (r.nome_relatado+' '+r.local+' '+r.titulo+' '+(r.trecho||'')).toLowerCase();
      if(!hay.includes(q)) return;
    }
    r._marker.addTo(clusterGroup);
    shown++;
  });
  document.getElementById('visibleCount').textContent =
    `${shown.toLocaleString('pt-BR')} de ${DATA.relatos.length.toLocaleString('pt-BR')} relatos no mapa`;
}

fetch('./relatos.json')
  .then(res=>{
    if(!res.ok) throw new Error(`HTTP ${res.status} ao buscar relatos.json`);
    const ct = res.headers.get('content-type') || '';
    if(ct.includes('text/html')) throw new Error('O servidor devolveu uma página HTML no lugar do relatos.json (arquivo não encontrado nesse caminho).');
    return res.json();
  })
  .then(data=>{
    DATA = data;
    markersByCat = {};
    data.relatos.forEach(r=>{
      const marker = L.marker([r.lat, r.lon], { icon:getIcon(r.categoria), cat:r.categoria });
      marker.bindPopup(popupHtml(r), { closeButton:true, maxWidth:300 });
      r._marker = marker;
      (markersByCat[r.categoria] = markersByCat[r.categoria]||[]).push(marker);
    });
    buildCatPanel();
    document.querySelectorAll('#catList input').forEach(el=> el.addEventListener('change', refresh));
    let t;
    document.getElementById('search').addEventListener('input', ()=>{
      clearTimeout(t); t = setTimeout(refresh, 180);
    });
    document.getElementById('selAll').addEventListener('click', ()=>{
      document.querySelectorAll('#catList input').forEach(el=>el.checked=true); refresh();
    });
    document.getElementById('selNone').addEventListener('click', ()=>{
      document.querySelectorAll('#catList input').forEach(el=>el.checked=false); refresh();
    });
    document.getElementById('statsFloatBtn').disabled = false;
    refresh();
    document.getElementById('loading').style.opacity='0';
    setTimeout(()=> document.getElementById('loading').style.display='none', 400);
  })
  .catch(err=>{
    document.getElementById('loading').innerHTML =
      `<div class="glyph">⚠️</div><div>Não consegui carregar relatos.json.<br>${esc(err.message)}<br><br>Confira se relatos.json está na mesma pasta deste index.html, com esse nome exato.</div>`;
    console.error(err);
  });

// ---- painel: recolher/expandir e fixar ----
const panelEl = document.getElementById('panel');
const panelHeaderBtn = document.getElementById('panelHeader');
const pinBtn = document.getElementById('pinBtn');
const PIN_KEY = 'mapaArrepiar.fixado';

function applyPanelState(collapsed){
  panelEl.classList.toggle('collapsed', collapsed);
  panelHeaderBtn.setAttribute('aria-expanded', String(!collapsed));
}
function loadPinPref(){
  try{ return localStorage.getItem(PIN_KEY) === '1'; }catch(e){ return false; }
}
function savePinPref(v){
  try{ localStorage.setItem(PIN_KEY, v ? '1' : '0'); }catch(e){}
}

// o painel sempre começa fechado; só o estado "fixado" é lembrado entre visitas
let pinned = loadPinPref();
applyPanelState(true);
pinBtn.classList.toggle('pinned', pinned);
pinBtn.setAttribute('aria-pressed', String(pinned));

panelHeaderBtn.addEventListener('click', ()=>{
  applyPanelState(!panelEl.classList.contains('collapsed'));
});

pinBtn.addEventListener('click', (ev)=>{
  ev.stopPropagation();
  pinned = !pinned;
  pinBtn.classList.toggle('pinned', pinned);
  pinBtn.setAttribute('aria-pressed', String(pinned));
  savePinPref(pinned);
});

// clicar no mapa (fora de marcadores/controles) fecha o painel, a menos que esteja fixado
map.on('click', ()=>{
  if(!pinned && !panelEl.classList.contains('collapsed')) applyPanelState(true);
});

// ---- modal de estatísticas ----
const statsFloatBtn = document.getElementById('statsFloatBtn');
const statsOverlay = document.getElementById('statsOverlay');
const statsClose = document.getElementById('statsClose');

function wireChartToggle(donutBtn, barsBtn, donutView, barsView){
  function set(view){
    const showDonut = view === 'donut';
    donutView.hidden = !showDonut;
    barsView.hidden = showDonut;
    donutBtn.classList.toggle('active', showDonut);
    barsBtn.classList.toggle('active', !showDonut);
  }
  donutBtn.addEventListener('click', ()=> set('donut'));
  barsBtn.addEventListener('click', ()=> set('bars'));
  return set;
}
const setGlobalChartView = wireChartToggle(
  document.getElementById('toggleDonut'), document.getElementById('toggleBars'),
  document.getElementById('statsDonutView'), document.getElementById('statsBarsView'));
const setLocalChartView = wireChartToggle(
  document.getElementById('localToggleDonut'), document.getElementById('localToggleBars'),
  document.getElementById('localDonutView'), document.getElementById('localBarsView'));

// navegação entre as "páginas" do modal (geral / por lugar / por categoria), com pilha de "voltar"
const STATS_PAGES = ['statsGlobalView', 'statsLocalView', 'statsCategoryView'];
let statsPageStack = [];

function currentStatsPage(){
  return STATS_PAGES.find(id => !document.getElementById(id).hidden) || 'statsGlobalView';
}
function showStatsPage(pageId){
  STATS_PAGES.forEach(id=> document.getElementById(id).hidden = (id !== pageId));
}
function goToStatsPage(pageId){
  statsPageStack.push(currentStatsPage());
  showStatsPage(pageId);
}
function goBackStatsPage(){
  showStatsPage(statsPageStack.pop() || 'statsGlobalView');
}

function openStats(){
  statsPageStack = [];
  showStatsPage('statsGlobalView');
  buildStats();
  setGlobalChartView('donut');
  statsOverlay.hidden = false;
}
function closeStats(){
  statsOverlay.hidden = true;
}
statsFloatBtn.addEventListener('click', openStats);
statsClose.addEventListener('click', closeStats);
statsOverlay.addEventListener('click', (ev)=>{
  const catBtn = ev.target.closest('.catLink[data-cat]');
  if(catBtn){ openCategoryStats(catBtn.dataset.cat); return; }
  if(ev.target === statsOverlay) closeStats();
});
document.addEventListener('keydown', (ev)=>{
  if(ev.key === 'Escape' && !statsOverlay.hidden) closeStats();
});

document.getElementById('statsBackBtn').addEventListener('click', goBackStatsPage);
document.getElementById('statsCatBackBtn').addEventListener('click', goBackStatsPage);
</script>
</body>
