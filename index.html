<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de Arrepiar — Aparições do Pará e do Brasil</title>
<meta name="description" content="Mapa interativo com relatos de lobisomem, matinta, boto, OVNI, fantasma e outras aparições do canal Belém de Arrepiar.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%91%BB</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<style>
  :root{
    --bg:#0E1B16;
    --panel:#152420;
    --panel-2:#1B2C26;
    --border:#2A3B33;
    --fg:#EDE7DA;
    --fg-muted:#9FB0A6;
    --accent:#E8A33D;
    --accent-2:#F2B95C;
    --danger:#C0553A;
    --radius:14px;
    --shadow:0 12px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--fg);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    overflow:hidden;
  }
  h1,h2,h3,.display{ font-family:'Fraunces',serif; font-optical-sizing:auto; }
  #map{
    position:fixed; inset:0;
    padding-top:env(safe-area-inset-top,0px);
  }
  .leaflet-container{ background:#0A1512; }
  .darkTiles{
    filter: invert(1) hue-rotate(175deg) brightness(.92) contrast(.88) saturate(1.15);
  }
  .leaflet-control-attribution{ background:rgba(10,18,15,.75) !important; color:var(--fg-muted) !important; font-size:10.5px; }
  .leaflet-control-attribution a{ color:var(--fg-muted) !important; }
  .leaflet-control-zoom a{
    background:var(--panel) !important; color:var(--fg) !important; border-color:var(--border) !important;
  }
  .leaflet-control-zoom a:hover{ background:var(--panel-2) !important; }

  /* ---- Topbar ---- */
  #topbar{
    position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); left:16px; right:16px;
    z-index:1000; display:flex; gap:10px; align-items:flex-start; pointer-events:none;
  }
  .brand{
    pointer-events:auto; position:relative; overflow:hidden;
    background:linear-gradient(160deg, var(--panel), var(--panel-2));
    border:1px solid var(--border); border-radius:var(--radius);
    padding:11px 16px 11px 14px; box-shadow:var(--shadow); display:flex; align-items:center; gap:10px;
    max-width:min(420px, 62vw);
  }
  .brand::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(var(--accent), var(--accent-2));
  }
  .brand .glyph{ font-size:1.6rem; line-height:1; filter:drop-shadow(0 0 8px rgba(232,163,61,.55)); }
  .brand h1{ font-size:1.1rem; margin:0; font-weight:600; letter-spacing:.2px; }
  .brand h1 .ver{ font-size:.68rem; font-weight:500; color:var(--fg-muted); font-family:'Inter',sans-serif; vertical-align:middle; }
  .brand p{ margin:2px 0 0; font-size:.72rem; color:var(--fg-muted); font-style:italic; font-family:'Fraunces',serif; }

  #searchWrap{ pointer-events:auto; flex:1; display:flex; justify-content:flex-end; gap:8px; }
  #search{
    width:min(260px,40vw); background:var(--panel); border:1px solid var(--border); color:var(--fg);
    border-radius:999px; padding:10px 16px; font-size:.85rem; box-shadow:var(--shadow); outline:none;
    font-family:'Inter',sans-serif;
  }
  #search::placeholder{ color:var(--fg-muted); }
  #search:focus{ border-color:var(--accent); }
  #panelToggle{
    display:none; pointer-events:auto; background:var(--accent); color:#1A1208; border:none;
    width:42px; height:42px; border-radius:50%; font-size:1.1rem; box-shadow:var(--shadow); cursor:pointer;
  }

  /* ---- Side panel ---- */
  #panel{
    position:fixed; top:calc(74px + env(safe-area-inset-top,0px)); left:16px;
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    width:284px; z-index:900;
    background:linear-gradient(180deg, var(--panel), var(--panel-2) 140%);
    border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden;
  }
  #panel .panelHead{ padding:15px 16px 10px; border-bottom:1px solid var(--border); position:relative; }
  #panel .panelHead::after{
    content:''; position:absolute; left:16px; bottom:-1px; width:34px; height:2px; background:var(--accent);
  }
  #panel .panelHead h2{ font-size:1rem; margin:0 0 3px; font-weight:600; }
  #panel .panelHead p{ margin:0; font-size:.72rem; color:var(--fg-muted); }
  #catList{ flex:1; overflow-y:auto; padding:6px 8px; }
  .catRow{
    display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:9px; cursor:pointer;
    font-size:.83rem; user-select:none;
  }
  .catRow:hover{ background:var(--panel-2); }
  .catRow input{ accent-color:var(--accent); width:15px; height:15px; flex:none; }
  .catRow .dot{ width:20px; height:20px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; }
  .catRow .dot svg{ width:14px; height:14px; }
  .catRow .name{ flex:1; }
  .catRow .count{ color:var(--fg-muted); font-size:.74rem; font-variant-numeric:tabular-nums; }
  #panelFoot{ border-top:1px solid var(--border); padding:10px 14px 12px; font-size:.72rem; color:var(--fg-muted); }
  .footRow{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; }
  .linkBtn{ background:none; border:none; color:var(--accent); font-size:.74rem; cursor:pointer; padding:0; font-family:'Inter',sans-serif; }
  .linkBtn:hover{ text-decoration:underline; }
  .toggleRow{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  .toggleRow input{ accent-color:var(--accent); }
  #legend{ display:flex; flex-wrap:wrap; gap:6px 10px; margin-top:8px; }
  #legend span{ display:flex; align-items:center; gap:5px; font-size:.68rem; color:var(--fg-muted); }
  #legend i{ width:8px; height:8px; border-radius:50%; display:inline-block; }

  /* ---- Popup ---- */
  .leaflet-popup-content-wrapper{
    background:var(--panel); color:var(--fg); border-radius:12px; border:1px solid var(--border);
  }
  .leaflet-popup-tip{ background:var(--panel); }
  .leaflet-popup-content{ margin:0; width:280px !important; }
  .leaflet-popup-close-button{ color:var(--fg-muted) !important; }
  .pop{ padding:12px 14px 14px; }
  .pop .head{ display:flex; align-items:center; gap:9px; margin-bottom:8px; }
  .pop .head .dot{ width:30px; height:30px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; }
  .pop .head .dot svg{ width:20px; height:20px; }
  .pop .head .cat{ font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--fg-muted); }
  .pop .head .rel{ font-family:'Fraunces',serif; font-size:1.02rem; font-weight:600; line-height:1.15; }
  .pop .loc{ font-size:.78rem; color:var(--accent-2); margin-bottom:6px; }
  .pop .obs{ font-size:.68rem; color:var(--fg-muted); font-style:italic; margin:-4px 0 6px; }
  .pop .trecho{ font-size:.78rem; line-height:1.45; color:#D9D2C2; margin-bottom:10px;
    max-height:120px; overflow-y:auto; padding-right:2px; }
  .pop .low{ display:inline-block; font-size:.64rem; background:rgba(192,85,58,.18); color:#E08A6E;
    border:1px solid rgba(192,85,58,.4); border-radius:999px; padding:1px 8px; margin-bottom:8px; }
  .pop a.watch{
    display:flex; align-items:center; justify-content:center; gap:7px; background:var(--accent); color:#1A1208;
    text-decoration:none; font-weight:600; font-size:.82rem; padding:9px 10px; border-radius:9px;
  }
  .pop a.watch:hover{ background:var(--accent-2); }
  .pop .playerWrap{
    position:relative; width:100%; aspect-ratio:16/9; border-radius:9px; overflow:hidden; margin-bottom:8px;
    background:#000;
  }
  .pop .playerWrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .pop .facade{
    position:absolute; inset:0; width:100%; height:100%; border:0; cursor:pointer; padding:0;
    background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center;
  }
  .pop .facade::after{ content:''; position:absolute; inset:0; background:rgba(0,0,0,.18); }
  .pop .facade .playBtn{
    position:relative; z-index:1; width:46px; height:46px; border-radius:50%; background:rgba(20,16,10,.78);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:1.1rem;
    box-shadow:0 0 0 2px rgba(255,255,255,.5);
  }
  .pop .toggleFull{
    display:block; text-align:center; font-size:.68rem; color:var(--fg-muted); text-decoration:none; margin:-4px 0 8px;
  }
  .pop .toggleFull:hover{ color:var(--accent-2); }

  /* cluster icons */
  .arrepiar-cluster{
    background:radial-gradient(circle at 32% 26%, var(--accent-2), var(--accent) 72%);
    color:#1A1208; border:2px solid rgba(10,8,3,.5); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'Inter',sans-serif;
  }
  .marker-icon-wrap{
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.55)) drop-shadow(0 0 7px color-mix(in srgb, var(--glow) 65%, transparent));
    transition: transform .15s ease;
  }
  .leaflet-marker-icon:hover .marker-icon-wrap{ transform:scale(1.18); }
  .marker-icon-wrap.low{ opacity:.68; }

  #loading{
    position:fixed; inset:0; z-index:2000;
    background:radial-gradient(circle at 50% 42%, #16241E, var(--bg) 72%);
    color:var(--fg-muted);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    font-size:.85rem; transition:opacity .5s ease;
  }
  #loading .glyph{ font-size:2.6rem; animation:riseGlow 2.2s ease-in-out infinite; }
  #loading .lTitle{ font-family:'Fraunces',serif; color:var(--fg); font-size:1.3rem; margin-top:6px; }
  @keyframes riseGlow{
    0%,100%{ transform:translateY(0); filter:drop-shadow(0 0 10px rgba(232,163,61,.35)); }
    50%{ transform:translateY(-6px); filter:drop-shadow(0 0 20px rgba(232,163,61,.65)); }
  }
  @media (prefers-reduced-motion: reduce){ #loading .glyph{ animation:none; } }

  @media (max-width: 760px){
    #topbar{ left:10px; right:10px; top:calc(10px + env(safe-area-inset-top,0px)); }
    .brand{ max-width:60vw; padding:8px 12px; }
    .brand h1{ font-size:.92rem; }
    .brand p{ display:none; }
    #search{ width:100%; }
    #panelToggle{ display:flex; align-items:center; justify-content:center; }
    #panel{
      left:10px; right:10px; width:auto; top:auto;
      bottom:calc(10px + env(safe-area-inset-bottom,0px));
      max-height:62vh; transform:translateY(calc(100% + 20px)); transition:transform .25s ease;
    }
    #panel.open{ transform:translateY(0); }
  }
</style>
</head>
<body>

<div id="loading"><div class="glyph">🌙</div><div class="lTitle">Mapa de Arrepiar</div><div>Carregando os relatos…</div></div>

<div id="map"></div>

<div id="topbar">
  <div class="brand">
    <span class="glyph">🌙</span>
    <div>
      <h1>Mapa de Arrepiar <span class="ver">v6.1</span></h1>
      <p>Aparições relatadas no canal Belém de Arrepiar</p>
    </div>
  </div>
  <div id="searchWrap">
    <input id="search" type="text" placeholder="Buscar lugar, criatura ou palavra do relato…">
  </div>
  <button id="panelToggle" aria-label="Abrir filtros">☰</button>
</div>

<div id="panel">
  <div class="panelHead">
    <h2>Categorias</h2>
    <p id="visibleCount">carregando…</p>
  </div>
  <div id="catList"></div>
  <div id="panelFoot">
    <div class="footRow">
      <button class="linkBtn" id="selAll">Marcar todas</button>
      <button class="linkBtn" id="selNone">Desmarcar todas</button>
    </div>
    <label class="toggleRow">
      <input type="checkbox" id="hideLow"> Ocultar relatos de baixa confiança
    </label>
    <div id="legend"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

const GROUPS = [["folclore", "Folclore amazônico", "#2E7D4F"], ["criptideo", "Criptídeo", "#8A3324"], ["fantasma", "Fantasma / bruxaria", "#6A4FA0"], ["ufologia", "Ufologia", "#1F6F8B"], ["outros", "Outros", "#6B6F76"]];

function catIconHtml(cat, low){
  const m = CAT_META[cat] || CAT_META['Outros'];
  return `<div class="marker-icon-wrap${low ? ' low' : ''}" style="--glow:${m.cor}">${m.svg}</div>`;
}
const iconCache = {};
function getIcon(cat, low){
  const key = cat + (low?'-low':'');
  if(!iconCache[key]){
    iconCache[key] = L.divIcon({
      html: catIconHtml(cat, low),
      className: '',
      iconSize: [34,34],
      iconAnchor: [17,17],
      popupAnchor: [0,-15],
    });
  }
  return iconCache[key];
}

function clusterIcon(cluster){
  const n = cluster.getChildCount();
  let size = 36;
  if(n>=50) size=58; else if(n>=10) size=46;
  const tally = {};
  cluster.getAllChildMarkers().forEach(m=>{
    const g = (CAT_META[m.options.cat]||{}).grupo || 'outros';
    tally[g] = (tally[g]||0) + 1;
  });
  const dominant = Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  const ring = dominant ? (GROUPS.find(g=>g[0]===dominant[0])||[])[2] : 'var(--accent)';
  return L.divIcon({
    html: `<div class="arrepiar-cluster" style="width:${size}px;height:${size}px;font-size:${size>50?'1rem':'.82rem'};box-shadow:0 0 0 2.5px ${ring}, 0 6px 16px rgba(0,0,0,.5)">${n}</div>`,
    className:'', iconSize:[size,size]
  });
}

const clusterGroup = L.markerClusterGroup({
  iconCreateFunction: clusterIcon,
  showCoverageOnHover:false,
  spiderfyOnMaxZoom:true,
  maxClusterRadius:50,
});
map.addLayer(clusterGroup);
map.on('popupopen', (e)=>{
  L.DomEvent.disableClickPropagation(e.popup._contentNode);
  L.DomEvent.disableScrollPropagation(e.popup._contentNode);
});

function esc(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function trimTrecho(t){
  if(!t) return '';
  t = t.trim();
  return t.length>260 ? t.slice(0,260).trim()+'…' : t;
}
function ytId(url){
  const m = /(?:v=|youtu\.be\/|embed\/)([\w-]{11})/.exec(url||'');
  return m ? m[1] : null;
}
function ytStart(r){
  const m = /[?&]t=(\d+)s?/.exec(r.link_minuto||'');
  if(m) return parseInt(m[1],10);
  const mm = /^(\d+):(\d\d):(\d\d)$/.exec(r.minuto||'');
  if(mm) return (+mm[1])*3600 + (+mm[2])*60 + (+mm[3]);
  return 0;
}
window.loadYTPlayer = function(ev, btn, id, start){
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  const wrap = btn.parentElement;
  const iframe = document.createElement('iframe');
  iframe.src = `https://www.youtube-nocookie.com/embed/${id}?start=${start}&autoplay=1&rel=0`;
  iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
  iframe.allowFullscreen = true;
  wrap.innerHTML = '';
  wrap.appendChild(iframe);
};
function popupHtml(r){
  const m = CAT_META[r.categoria] || CAT_META['Outros'];
  const low = r.baixa_confianca ? `<div class="low">relato de baixa confiança</div>` : '';
  const obs = r.observacao ? `<div class="obs">${esc(r.observacao)}</div>` : '';
  const min = (r.minuto && r.minuto !== '—') ? ` a partir de ${esc(r.minuto)}` : '';
  const id = ytId(r.video_url);
  const start = ytStart(r);
  const player = id ? `<div class="playerWrap">
      <button class="facade" type="button" style="background-image:url('https://i.ytimg.com/vi/${id}/hqdefault.jpg')"
        onclick="loadYTPlayer(event, this, '${id}', ${start})" aria-label="Assistir aqui">
        <span class="playBtn">▶</span>
      </button>
    </div>` : '';
  return `<div class="pop">
    <div class="head">
      <div class="dot" style="background:${m.cor}">${m.svg.replace('width="64" height="64"','width="20" height="20"')}</div>
      <div><div class="cat">${esc(m.rotulo)}</div><div class="rel">${esc(r.nome_relatado || r.categoria)}</div></div>
    </div>
    <div class="loc">📍 ${esc(r.local)}</div>
    ${obs}
    ${low}
    <div class="trecho">${esc(trimTrecho(r.trecho))}</div>
    ${player}
    <a class="watch" href="${esc(r.link_minuto || r.video_url)}" target="_blank" rel="noopener">▶ Abrir no YouTube${min}</a>
  </div>`;
}

let DATA = null;
let markersByCat = {};

function buildCatPanel(){
  const list = document.getElementById('catList');
  list.innerHTML = '';
  CAT_ORDER.forEach(cat=>{
    const m = CAT_META[cat];
    const count = (markersByCat[cat]||[]).length;
    const row = document.createElement('label');
    row.className='catRow';
    row.innerHTML = `<input type="checkbox" checked data-cat="${esc(cat)}">
      <span class="dot" style="background:${m.cor}">${m.svg.replace('width="64" height="64"','width="13" height="13"')}</span>
      <span class="name">${esc(m.rotulo)}</span><span class="count">${count}</span>`;
    list.appendChild(row);
  });
  document.getElementById('legend').innerHTML = GROUPS.map(g=>
    `<span><i style="background:${g[2]}"></i>${esc(g[1])}</span>`).join('');
}

function activeCats(){
  return Array.from(document.querySelectorAll('#catList input:checked')).map(el=>el.dataset.cat);
}

function refresh(){
  const cats = new Set(activeCats());
  const hideLow = document.getElementById('hideLow').checked;
  const q = document.getElementById('search').value.trim().toLowerCase();
  clusterGroup.clearLayers();
  let shown = 0;
  DATA.relatos.forEach(r=>{
    if(!cats.has(r.categoria)) return;
    if(hideLow && r.baixa_confianca) return;
    if(q){
      const hay = (r.nome_relatado+' '+r.local+' '+r.titulo+' '+(r.trecho||'')).toLowerCase();
      if(!hay.includes(q)) return;
    }
    r._marker.addTo(clusterGroup);
    shown++;
  });
  document.getElementById('visibleCount').textContent =
    `${shown.toLocaleString('pt-BR')} de ${DATA.relatos.length.toLocaleString('pt-BR')} relatos no mapa`;
}

fetch('./relatos.json')
  .then(res=>{
    if(!res.ok) throw new Error(`HTTP ${res.status} ao buscar relatos.json`);
    const ct = res.headers.get('content-type') || '';
    if(ct.includes('text/html')) throw new Error('O servidor devolveu uma página HTML no lugar do relatos.json (arquivo não encontrado nesse caminho).');
    return res.json();
  })
  .then(data=>{
    DATA = data;
    markersByCat = {};
    data.relatos.forEach(r=>{
      const marker = L.marker([r.lat, r.lon], { icon:getIcon(r.categoria, r.baixa_confianca), cat:r.categoria });
      marker.bindPopup(popupHtml(r), { closeButton:true, maxWidth:300 });
      r._marker = marker;
      (markersByCat[r.categoria] = markersByCat[r.categoria]||[]).push(marker);
    });
    buildCatPanel();
    document.querySelectorAll('#catList input').forEach(el=> el.addEventListener('change', refresh));
    document.getElementById('hideLow').addEventListener('change', refresh);
    let t;
    document.getElementById('search').addEventListener('input', ()=>{
      clearTimeout(t); t = setTimeout(refresh, 180);
    });
    document.getElementById('selAll').addEventListener('click', ()=>{
      document.querySelectorAll('#catList input').forEach(el=>el.checked=true); refresh();
    });
    document.getElementById('selNone').addEventListener('click', ()=>{
      document.querySelectorAll('#catList input').forEach(el=>el.checked=false); refresh();
    });
    refresh();
    document.getElementById('loading').style.opacity='0';
    setTimeout(()=> document.getElementById('loading').style.display='none', 400);
  })
  .catch(err=>{
    document.getElementById('loading').innerHTML =
      `<div class="glyph">⚠️</div><div>Não consegui carregar relatos.json.<br>${esc(err.message)}<br><br>Confira se relatos.json está na mesma pasta deste index.html, com esse nome exato.</div>`;
    console.error(err);
  });

const panel = document.getElementById('panel');
document.getElementById('panelToggle').addEventListener('click', ()=> panel.classList.toggle('open'));
</script>
</body>
</html>
